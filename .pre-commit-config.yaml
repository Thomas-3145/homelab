repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.3
    hooks:
      - id: terraform_fmt

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Renders every overlay and schema-checks the output. Runs the same script as
  # CI. Only fires when manifests change — ~3s then, nothing otherwise.
  # Needs kustomize + kubeconform on PATH; the script says so if they're missing.
  - repo: local
    hooks:
      - id: kustomize-build
        name: Kustomize render + schema check
        entry: scripts/validate-kustomizations.sh
        language: script
        files: ^kubernetes/
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
