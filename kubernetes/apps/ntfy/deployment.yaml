apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: ntfy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      containers:
        - name: ntfy
          # v2.11 has no message templating — Alertmanager webhooks arrive as
          # raw JSON. Templating (and the built-in alertmanager template) needs
          # a newer server; verified against the live v2.11 that ?template= is
          # silently ignored.
          image: binwiederhier/ntfy:v2.26.0
          args: ["serve"]
          env:
            - name: NTFY_BASE_URL
              value: https://ntfy.3145.blog
            - name: NTFY_LISTEN_HTTP
              value: ":80"
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 100m
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
