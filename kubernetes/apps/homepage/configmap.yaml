apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Thomas Homelab
    language: sv
    headerStyle: boxedWidgets
    quicklaunch:
      searchDescriptions: true
      provider: google
    layout:
      Kluster:
        style: column
        columns: 4
      System:
        style: column
        columns: 2
      Tjänster:
        style: column
        columns: 2
  kubernetes.yaml: |
    mode: cluster
  bookmarks.yaml: ""
  services.yaml: |
    - Kluster:
        - ArgoCD:
            icon: argocd.png
            href: http://argocd.local
            description: GitOps
        - Headlamp:
            icon: headlamp.png
            href: http://headlamp.local
            description: Kubernetes Dashboard
        - ingress-nginx:
            icon: nginx.png
            description: Ingress Controller
        - cert-manager:
            icon: cert-manager.png
            description: Certifikathantering
    - System:
        - Proxmox:
            icon: proxmox.png
            href: https://192.168.10.20:8006
            description: Hypervisor
    - Tjänster:
        - Ghost:
            icon: ghost.png
            href: https://3145.blog/
            description: Blogg
        - Ghost Admin:
            icon: ghost.png
            href: https://3145.blog/ghost
            description: Adminpanel
        - Vaultwarden:
            icon: vaultwarden.png
            href: https://vault.3145.blog/
            description: Lösenordshantering
  widgets.yaml: |
    - search:
        provider: google
        target: _blank
    - datetime:
        locale: sv
        format:
          dateStyle: long
          timeStyle: short
    - openmeteo:
        latitude: 59.290527
        longitude: 17.967611
        units: metric
        cache: 15
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
