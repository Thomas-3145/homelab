apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Thomas Homelab
    language: sv
  kubernetes.yaml: |
    mode: cluster
  bookmarks.yaml: ""
  services.yaml: ""
  widgets.yaml: |
    - datetime:
        locale: sv
        format:
          dateStyle: long
          timeStyle: short
    - openmeteo:
        latitude: 59.290527
        longitude: 17.967611
        units: metric
        cache: 15
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
