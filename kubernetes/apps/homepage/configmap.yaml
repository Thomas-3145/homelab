apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Thomas Homelab
    language: sv
    theme: dark
    color: slate
    headerStyle: clean
    statusStyle: dot
    hideVersion: true
    quicklaunch:
      searchDescriptions: true
      provider: google
    layout:
      System:
      Kluster:
        initiallyCollapsed: false
      Tjänster:
        initiallyCollapsed: false
      Nedladdningar:
        initiallyCollapsed: false
  kubernetes.yaml: |
    mode: cluster
  bookmarks.yaml: ""
  services.yaml: |
    - System:
        - Uptime Kuma:
            icon: uptime-kuma.svg
            href: https://kuma.3145.blog
            description: Övervakning
            widget:
              type: uptimekuma
              url: http://3145.taild78f1d.ts.net:3001
              slug: homepage
        - Proxmox:
            icon: proxmox.svg
            href: https://192.168.10.20:8006
            description: Hypervisor
            widget:
              type: proxmox
              url: https://192.168.10.20:8006
              username: {{HOMEPAGE_VAR_PROXMOX_USER}}
              password: {{HOMEPAGE_VAR_PROXMOX_PASSWORD}}
        - ArgoCD:
            icon: argo-cd.svg
            href: http://argocd.local
            description: GitOps
            widget:
              type: argocd
              url: http://argocd-server.argocd.svc.cluster.local
              key: {{HOMEPAGE_VAR_ARGOCD_KEY}}
        - Grafana:
            icon: grafana.svg
            href: https://grafana.3145.blog/d/b9a850a0-9e65-4b83-9c5c-8139d69340ff/cluster-overview?orgId=1&from=now-30m&to=now&timezone=browser
            description: Dashboards & Metrics
            widget:
              type: grafana
              url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
              username: {{HOMEPAGE_VAR_GRAFANA_USER}}
              password: {{HOMEPAGE_VAR_GRAFANA_PASSWORD}}
    - Kluster:
        - AdGuardHome:
            icon: si-adguard
            href: http://192.168.8.1:3000/
            description: DNS-filtrering
            widget:
              type: adguard
              url: http://gl-mt6000.taild78f1d.ts.net:3000
              username: admin
              password: {{HOMEPAGE_VAR_ADGUARD_PASSWORD}}
        - PBS:
            icon: proxmox.svg
            href: https://3145.taild78f1d.ts.net:8007
            description: Backup Server (3145)
            widget:
              type: proxmoxbackupserver
              url: https://3145.taild78f1d.ts.net:8007
              username: {{HOMEPAGE_VAR_PBS_USER}}
              password: {{HOMEPAGE_VAR_PBS_PASSWORD}}
        - Headlamp:
            icon: headlamp.svg
            href: http://headlamp.local
            description: Kubernetes Dashboard
        - ingress-nginx:
            icon: nginx.svg
            description: Ingress Controller
        - cert-manager:
            icon: cert-manager.svg
            description: Certifikathantering
    - Tjänster:
        - Jellyfin:
            icon: jellyfin.svg
            href: https://jellyfin.3145.blog
            description: Mediaserver
            widget:
              type: jellyfin
              url: https://jellyfin.3145.blog
              key: {{HOMEPAGE_VAR_JELLYFIN_KEY}}
        - Seerr:
            icon: seerr.svg
            href: http://3145.taild78f1d.ts.net:5055/
            description: taaaack
            widget:
              type: seerr
              url: http://3145.taild78f1d.ts.net:5055/
              key: {{HOMEPAGE_VAR_SEERR_KEY}}
        - IT-Tools:
            icon: it-tools.svg
            href: http://it-tools.local
            description: Developer utilities
        - Ghost:
            icon: ghost.png
            href: https://3145.blog/
            description: Blogg
        - Ghost Admin:
            icon: ghost.png
            href: https://3145.blog/ghost
            description: Adminpanel
        - Vaultwarden:
            icon: vaultwarden.svg
            href: https://vault.3145.blog/
            description: Lösenordshantering
    - Nedladdningar:
        - Sonarr:
            icon: sonarr.svg
            href: https://sonarr.3145.blog
            description: TV-serier
            widget:
              type: sonarr
              url: https://sonarr.3145.blog
              key: {{HOMEPAGE_VAR_SONARR_KEY}}
        - Radarr:
            icon: radarr.svg
            href: https://radarr.3145.blog
            description: Filmer
            widget:
              type: radarr
              url: https://radarr.3145.blog
              key: {{HOMEPAGE_VAR_RADARR_KEY}}
        - Bazarr:
            icon: bazarr.svg
            href: https://bazarr.3145.blog
            description: Undertexter
            widget:
              type: bazarr
              url: http://3145.taild78f1d.ts.net:6767/
              key: {{HOMEPAGE_VAR_BAZARR_KEY}}
        - qBittorrent:
            icon: qbittorrent.svg
            href: https://qbittorrent.3145.blog
            description: Torrent-klient
            widget:
              type: qbittorrent
              url: https://qbittorrent.3145.blog
              username: {{HOMEPAGE_VAR_QBIT_USER}}
              password: {{HOMEPAGE_VAR_QBIT_PASSWORD}}
        - Prowlarr:
            icon: prowlarr.svg
            href: https://prowlarr.3145.blog
            description: Indexer-hantering
            widget:
              type: prowlarr
              url: https://prowlarr.3145.blog
              key: {{HOMEPAGE_VAR_PROWLARR_KEY}}
  widgets.yaml: |
    - search:
        provider: google
        target: _blank
    - datetime:
        locale: sv
        format:
          dateStyle: long
          timeStyle: short
    - openmeteo:
        label: Väder
        latitude: 59.290527
        longitude: 17.967611
        timezone: Europe/Stockholm
        units: metric
        cache: 5
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
