apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Thomas Homelab
    language: sv
    theme: dark
    color: slate
    headerStyle: clean
    statusStyle: dot
    hideVersion: true
    quicklaunch:
      searchDescriptions: true
      provider: google
    layout:
      Kluster:
        initiallyCollapsed: true
      Nedladdningar:
        initiallyCollapsed: true
  kubernetes.yaml: |
    mode: cluster
  bookmarks.yaml: ""
  services.yaml: |
    - Kluster:
        - AdGuardHome:
            icon: si-adguard
            href: http://192.168.8.1:3000/
            description: DNS-filtrering
        - PBS:
            icon: proxmox.svg
            href: https://100.110.160.88:8007
            description: Backup Server (Media Pi)
            widget:
              type: proxmoxbackupserver
              url: https://100.110.160.88:8007
              username: {{HOMEPAGE_VAR_PBS_USER}}
              password: {{HOMEPAGE_VAR_PBS_PASSWORD}}
        - Longhorn:
            icon: longhorn.svg
            href: http://longhorn.local
            description: Distribuerad lagring
            widget:
              type: longhorn
              url: http://longhorn-frontend.longhorn-system.svc.cluster.local
        - Headlamp:
            icon: headlamp.svg
            href: http://headlamp.local
            description: Kubernetes Dashboard
        - ingress-nginx:
            icon: nginx.svg
            description: Ingress Controller
        - cert-manager:
            icon: cert-manager.svg
            description: Certifikathantering
    - Tjänster:
        - Jellyfin:
            icon: jellyfin.svg
            href: https://jellyfin.3145.blog
            description: Mediaserver
            widget:
              type: jellyfin
              url: https://jellyfin.3145.blog
              key: {{HOMEPAGE_VAR_JELLYFIN_KEY}}
        - IT-Tools:
            icon: it-tools.svg
            href: http://it-tools.local
            description: Developer utilities
        - Ghost:
            icon: ghost.png
            href: https://3145.blog/
            description: Blogg
        - Ghost Admin:
            icon: ghost.png
            href: https://3145.blog/ghost
            description: Adminpanel
        - Vaultwarden:
            icon: vaultwarden.svg
            href: https://vault.3145.blog/
            description: Lösenordshantering
    - System:
        - Uptime Kuma:
            icon: uptime-kuma.svg
            href: https://kuma.3145.blog
            description: Övervakning
            widget:
              type: uptimekuma
              url: http://100.110.160.88:3001
              slug: homepage
        - Proxmox:
            icon: proxmox.svg
            href: https://100.87.35.119:8006
            description: Hypervisor
            widget:
              type: proxmox
              url: https://100.87.35.119:8006
              username: {{HOMEPAGE_VAR_PROXMOX_USER}}
              password: {{HOMEPAGE_VAR_PROXMOX_PASSWORD}}
        - ArgoCD:
            icon: argo-cd.svg
            href: http://argocd.local
            description: GitOps
            widget:
              type: argocd
              url: http://argocd-server.argocd.svc.cluster.local
              key: {{HOMEPAGE_VAR_ARGOCD_KEY}}
    - Nedladdningar:
        - Sonarr:
            icon: sonarr.svg
            href: https://sonarr.3145.blog
            description: TV-serier
            widget:
              type: sonarr
              url: https://sonarr.3145.blog
              key: {{HOMEPAGE_VAR_SONARR_KEY}}
        - Radarr:
            icon: radarr.svg
            href: https://radarr.3145.blog
            description: Filmer
            widget:
              type: radarr
              url: https://radarr.3145.blog
              key: {{HOMEPAGE_VAR_RADARR_KEY}}
        - Bazarr:
            icon: bazarr.svg
            href: https://bazarr.3145.blog
            description: Undertexter
            widget:
              type: bazarr
              url: http://100.110.160.88:6767/
              key: {{HOMEPAGE_VAR_BAZARR_KEY}}
        - qBittorrent:
            icon: qbittorrent.svg
            href: https://qbittorrent.3145.blog
            description: Torrent-klient
            widget:
              type: qbittorrent
              url: https://qbittorrent.3145.blog
        - Prowlarr:
            icon: prowlarr.svg
            href: https://prowlarr.3145.blog
            description: Indexer-hantering
            widget:
              type: prowlarr
              url: https://prowlarr.3145.blog
              key: {{HOMEPAGE_VAR_PROWLARR_KEY}}
  widgets.yaml: |
    - search:
        provider: google
        target: _blank
    - datetime:
        locale: sv
        format:
          dateStyle: long
          timeStyle: short
    - openmeteo:
        label: Väder
        latitude: 59.290527
        longitude: 17.967611
        timezone: Europe/Stockholm
        units: metric
        cache: 5
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
