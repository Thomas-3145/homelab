apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Thomas Homelab
    language: sv
    theme: dark
    color: slate
    headerStyle: clean
    statusStyle: dot
    hideVersion: true
    quicklaunch:
      searchDescriptions: true
      provider: google
    layout:
      Kluster:
        initiallyCollapsed: true
      Nedladdningar:
        initiallyCollapsed: true
  kubernetes.yaml: |
    mode: cluster
  bookmarks.yaml: ""
  services.yaml: |
    - Kluster:
        - ArgoCD:
            icon: argocd.svg
            href: http://argocd.local
            description: GitOps
        - Headlamp:
            icon: headlamp.svg
            href: http://headlamp.local
            description: Kubernetes Dashboard
        - ingress-nginx:
            icon: nginx.svg
            description: Ingress Controller
        - cert-manager:
            icon: cert-manager.svg
            description: Certifikathantering
    - Tjänster:
        - Jellyfin:
            icon: jellyfin.svg
            href: https://jellyfin.3145.blog
            description: Mediaserver
            widget:
              type: jellyfin
              url: https://jellyfin.3145.blog
              key: 1dcb1c823db0452ead5e44148a35ed7a
        - Ghost:
            icon: ghost.svg
            href: https://3145.blog/
            description: Blogg
        - Ghost Admin:
            icon: ghost.svg
            href: https://3145.blog/ghost
            description: Adminpanel
        - Vaultwarden:
            icon: vaultwarden.svg
            href: https://vault.3145.blog/
            description: Lösenordshantering
    - System:
        - Uptime Kuma:
            icon: uptime-kuma.svg
            href: https://kuma.3145.blog
            description: Övervakning
            widget:
              type: uptimekuma
              url: https://kuma.3145.blog
              slug: homepage
        - Proxmox:
            icon: proxmox.svg
            href: https://100.87.35.119:8006
            description: Hypervisor
            widget:
              type: proxmox
              url: https://100.87.35.119:8006
              username: root@pam!homepage
              password: 6d0c5412-1273-4b6e-a81a-0237fbcb7919
    - Nedladdningar:
        - Sonarr:
            icon: sonarr.svg
            href: https://sonarr.3145.blog
            description: TV-serier
            widget:
              type: sonarr
              url: https://sonarr.3145.blog
              key: 52e1d37d93c5473c918c3b0fd50a9d97
        - Radarr:
            icon: radarr.svg
            href: https://radarr.3145.blog
            description: Filmer
            widget:
              type: radarr
              url: https://radarr.3145.blog
              key: e08acb52a08e486ebd95379c2360da90
        - Bazarr:
            icon: bazarr.svg
            href: https://bazarr.3145.blog
            description: Undertexter
            widget:
              type: bazarr
              url: http://100.110.160.88:6767/
              key: 726e5cefb0d5307ae9a1c4e51f13accb
        - qBittorrent:
            icon: qbittorrent.svg
            href: https://qbittorrent.3145.blog
            description: Torrent-klient
            widget:
              type: qbittorrent
              url: https://qbittorrent.3145.blog
        - Prowlarr:
            icon: prowlarr.svg
            href: https://prowlarr.3145.blog
            description: Indexer-hantering
            widget:
              type: prowlarr
              url: https://prowlarr.3145.blog
              key: 377574a1ec424a6381f483d625df98ae
  widgets.yaml: |
    - search:
        provider: google
        target: _blank
    - datetime:
        locale: sv
        format:
          dateStyle: long
          timeStyle: short
    - openmeteo:
        label: Väder
        latitude: 59.290527
        longitude: 17.967611
        timezone: Europe/Stockholm
        units: metric
        cache: 5
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
