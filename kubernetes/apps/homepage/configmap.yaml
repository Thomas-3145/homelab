apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Thomas Homelab
    language: sv
    theme: dark
    color: slate
    headerStyle: clean
    statusStyle: dot
    hideVersion: true
    quicklaunch:
      searchDescriptions: true
      provider: google
    layout:
      System:
      Kluster:
        initiallyCollapsed: false
      Tjänster:
        initiallyCollapsed: false
      Nedladdningar:
        initiallyCollapsed: true
    providers:
      longhorn:
        url: http://longhorn-frontend.longhorn-system.svc.cluster.local
  kubernetes.yaml: |
    mode: cluster
  bookmarks.yaml: ""
  services.yaml: |
    - System:
        - Gatus:
            icon: gatus.svg
            href: http://192.168.8.1:8888
            description: Nätverksövervakning
            widget:
              type: gatus
              url: http://192.168.8.1:8888
        - Proxmox:
            icon: proxmox.svg
            href: https://192.168.10.11:8006
            description: Hypervisor
            widget:
              type: proxmox
              url: https://192.168.10.11:8006
              username: {{HOMEPAGE_VAR_PROXMOX_USER}}
              password: {{HOMEPAGE_VAR_PROXMOX_PASSWORD}}
        - ArgoCD:
            icon: argo-cd.svg
            href: https://argocd.3145.blog
            description: GitOps
            widget:
              type: argocd
              url: http://argocd-server.argocd.svc.cluster.local
              key: {{HOMEPAGE_VAR_ARGOCD_KEY}}
        - Grafana:
            icon: grafana.svg
            href: https://grafana.3145.blog/d/b9a850a0-9e65-4b83-9c5c-8139d69340ff/cluster-overview?orgId=1&from=now-30m&to=now&timezone=browser
            description: Dashboards & Metrics
            widget:
              type: grafana
              url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
              username: {{HOMEPAGE_VAR_GRAFANA_USER}}
              password: {{HOMEPAGE_VAR_GRAFANA_PASSWORD}}
    - Kluster:
        - AdGuardHome:
            icon: si-adguard
            href: http://192.168.8.1:3000/
            description: DNS-filtrering
            widget:
              type: adguard
              url: http://192.168.8.1:3000
              username: admin
              password: {{HOMEPAGE_VAR_ADGUARD_PASSWORD}}
        - Longhorn:
            icon: longhorn.svg
            href: http://longhorn.3145.blog
            description: Persistent Storage
        - Headlamp:
            icon: headlamp.svg
            href: http://headlamp.local
            description: Kubernetes Dashboard
        - ingress-nginx:
            icon: nginx.svg
            description: Ingress Controller
        - cert-manager:
            icon: cert-manager.svg
            description: Certifikathantering
    - Tjänster:
        - Jellyfin:
            icon: jellyfin.svg
            href: http://192.168.10.40:8096
            description: Mediaserver
            widget:
              type: jellyfin
              url: http://192.168.10.40:8096
              key: {{HOMEPAGE_VAR_JELLYFIN_KEY}}
        - IT-Tools:
            icon: it-tools.svg
            href: http://it-tools.local
            description: Developer utilities
        - Ghost:
            icon: ghost.png
            href: https://3145.blog/
            description: Blogg
        - Ghost Admin:
            icon: ghost.png
            href: https://3145.blog/ghost
            description: Adminpanel
        - Stirling-PDF:
            icon: stirling-pdf.png
            href: http://stirling-pdf.local/
            description: PDF-fix
        - Vaultwarden:
            icon: vaultwarden.svg
            href: https://vault.3145.blog/
            description: Lösenordshantering
    - Nedladdningar:
        - Sonarr:
            icon: sonarr.svg
            href: http://192.168.10.40:8989
            description: TV-serier
            widget:
              type: sonarr
              url: http://192.168.10.40:8989
              key: {{HOMEPAGE_VAR_SONARR_KEY}}
        - Radarr:
            icon: radarr.svg
            href: http://192.168.10.40:7878
            description: Filmer
            widget:
              type: radarr
              url: http://192.168.10.40:7878
              key: {{HOMEPAGE_VAR_RADARR_KEY}}
        - Bazarr:
            icon: bazarr.svg
            href: http://192.168.10.40:6767
            description: Undertexter
            widget:
              type: bazarr
              url: http://192.168.10.40:6767
              key: {{HOMEPAGE_VAR_BAZARR_KEY}}
        - qBittorrent:
            icon: qbittorrent.svg
            href: http://192.168.10.40:8085
            description: Torrent-klient
            widget:
              type: qbittorrent
              url: http://192.168.10.40:8085
              username: {{HOMEPAGE_VAR_QBIT_USER}}
              password: {{HOMEPAGE_VAR_QBIT_PASSWORD}}
        - Prowlarr:
            icon: prowlarr.svg
            href: http://192.168.10.40:9696
            description: Indexer-hantering
            widget:
              type: prowlarr
              url: http://192.168.10.40:9696
              key: {{HOMEPAGE_VAR_PROWLARR_KEY}}
  widgets.yaml: |
    - search:
        provider: google
        target: _blank
    - datetime:
        locale: sv
        format:
          dateStyle: long
          timeStyle: short
    - openmeteo:
        label: Väder
        latitude: 59.290527
        longitude: 17.967611
        timezone: Europe/Stockholm
        units: metric
        cache: 5
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - longhorn:
        expanded: false
        total: true
        labels: false
        nodes: false
