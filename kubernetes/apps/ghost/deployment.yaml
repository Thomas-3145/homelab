apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost
  namespace: ghost
spec:
  replicas: 1
  # RWO volume (Longhorn) — the surge pod can never attach while the old pod
  # holds the volume, so rolling updates deadlock. Recreate stops the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ghost
  template:
    metadata:
      labels:
        app: ghost
    spec:
      # /var/lib/ghost and everything on the content PVC is already owned by
      # 1000 (the image's `node` user) — the container only ran as root because
      # nothing said otherwise. fsGroup keeps the volume reachable if Longhorn
      # ever re-provisions it.
      #
      # readOnlyRootFilesystem is deliberately absent: Ghost rewrites
      # /var/lib/ghost/.ghost-cli on boot. Tracked in .trivyignore.yaml.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Without this the kubelet re-walks the whole volume on every restart.
        # OnRootMismatch does it once, then skips while the top directory
        # already matches.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ghost
          image: docker.io/library/ghost:5
          env:
            - name: url
              value: https://3145.blog
            - name: database__client
              value: sqlite3
            - name: database__connection__filename
              value: /var/lib/ghost/content/data/ghost.db
            - name: NODE_ENV
              value: production
          ports:
            - containerPort: 2368
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: content
              mountPath: /var/lib/ghost/content
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 2368
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 2368
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: ghost-content
