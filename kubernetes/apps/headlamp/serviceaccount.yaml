---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: headlamp
---
# Headlamp runs with `-in-cluster` and is reached over the Cloudflare tunnel, so
# whoever holds the token below sees exactly what this ServiceAccount can read.
# It used to be `resources: ["*"]`, which included every Secret in the cluster —
# the sops age key, the Cloudflare token, Vaultwarden's admin token. Read-only
# is not harmless when the thing being read is a credential.
#
# The rights are now split in two:
#   1. the built-in `view` role — namespaced read for the standard resources,
#      minus Secrets. cert-manager's CRDs come along via role aggregation.
#   2. `headlamp-cluster-read` below — the cluster-scoped objects and the CRDs
#      that do not aggregate into `view`.
#
# Adding an operator with new CRDs? Its group needs a rule here or its objects
# stay invisible in the UI. That is the cost of not using a wildcard.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-cluster-read
rules:
  # Cluster-scoped core objects the dashboard's node and storage views need.
  # `namespaces` and metrics.k8s.io are deliberately absent — `view` already
  # grants both, and listing them twice hides where the right comes from.
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes", "componentstatuses"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["storage.k8s.io"]
    resources:
      - "storageclasses"
      - "volumeattachments"
      - "csidrivers"
      - "csinodes"
      - "csistoragecapacities"
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - "mutatingwebhookconfigurations"
      - "validatingwebhookconfigurations"
    verbs: ["get", "list", "watch"]

  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]

  # Reading RBAC is how you answer "why can this pod do that". It exposes no
  # credentials — a RoleBinding names a subject, it does not contain one.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - "clusterroles"
      - "clusterrolebindings"
      - "roles"
      - "rolebindings"
    verbs: ["get", "list", "watch"]

  # CRDs of the operators running here. cert-manager.io is absent on purpose:
  # it ships an aggregate-to-view role, so `view` already covers it.
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applicationsets", "appprojects"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["acme.cert-manager.io"]
    resources: ["challenges", "orders"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["longhorn.io"]
    resources:
      - "backingimagedatasources"
      - "backingimagemanagers"
      - "backingimages"
      - "backupbackingimages"
      - "backups"
      - "backuptargets"
      - "backupvolumes"
      - "engineimages"
      - "engines"
      - "instancemanagers"
      - "nodes"
      - "orphans"
      - "recurringjobs"
      - "replicas"
      - "settings"
      - "sharemanagers"
      - "snapshots"
      - "supportbundles"
      - "systembackups"
      - "systemrestores"
      - "volumeattachments"
      - "volumes"
    verbs: ["get", "list", "watch"]

  - apiGroups: ["metallb.io"]
    resources:
      - "bfdprofiles"
      - "bgpadvertisements"
      - "bgppeers"
      - "communities"
      - "ipaddresspools"
      - "l2advertisements"
      - "servicel2statuses"
    verbs: ["get", "list", "watch"]

  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - "alertmanagerconfigs"
      - "alertmanagers"
      - "podmonitors"
      - "probes"
      - "prometheusagents"
      - "prometheuses"
      - "prometheusrules"
      - "scrapeconfigs"
      - "servicemonitors"
      - "thanosrulers"
    verbs: ["get", "list", "watch"]

  - apiGroups: ["monitoring.grafana.com"]
    resources: ["podlogs"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["velero.io"]
    resources:
      - "backuprepositories"
      - "backups"
      - "backupstoragelocations"
      - "datadownloads"
      - "datauploads"
      - "deletebackuprequests"
      - "downloadrequests"
      - "podvolumebackups"
      - "podvolumerestores"
      - "restores"
      - "schedules"
      - "serverstatusrequests"
      - "volumesnapshotlocations"
    verbs: ["get", "list", "watch"]

  - apiGroups: ["upgrade.cattle.io"]
    resources: ["plans"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["helm.cattle.io"]
    resources: ["helmcharts", "helmchartconfigs"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["k3s.cattle.io"]
    resources: ["addons", "etcdsnapshotfiles"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - "backendtlspolicies"
      - "gatewayclasses"
      - "gateways"
      - "grpcroutes"
      - "httproutes"
      - "referencegrants"
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-cluster-read
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
---
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-token
  namespace: headlamp
  annotations:
    kubernetes.io/service-account.name: headlamp
type: kubernetes.io/service-account-token
