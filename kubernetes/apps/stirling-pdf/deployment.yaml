apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  replicas: 1
  # RWO volume (Longhorn) — the surge pod can never attach while the old pod
  # holds the volume, so rolling updates deadlock. Recreate stops the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stirling-pdf
  template:
    metadata:
      labels:
        app: stirling-pdf
    spec:
      # Runs as root, and has to. The image entrypoint chowns and chmods
      # /tmp/stirling-pdf and symlinks /usr/local/bin/diagnostics before the JVM
      # starts; as UID 1000 with dropped capabilities every one of those fails
      # and the container exits. Verified 2026-08-28 — the pod crashlooped on
      #   chown: cannot read directory '/tmp/stirling-pdf': Permission denied
      # Same shape as karakeep's s6-overlay entrypoint. Going non-root needs a
      # different image, not a different securityContext. Seccomp is kept
      # because it costs nothing here.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stirling-pdf
          image: docker.io/stirlingtools/stirling-pdf:2.8.0
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxMetaspaceSize=256m"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: configs
              mountPath: /configs
          resources:
            requests:
              cpu: 100m
              memory: 896Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 50
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: configs
          persistentVolumeClaim:
            claimName: stirling-pdf-configs
