apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  replicas: 1
  # RWO volume (Longhorn) — the surge pod can never attach while the old pod
  # holds the volume, so rolling updates deadlock. Recreate stops the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stirling-pdf
  template:
    metadata:
      labels:
        app: stirling-pdf
    spec:
      containers:
        - name: stirling-pdf
          image: stirlingtools/stirling-pdf:2.8.0
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxMetaspaceSize=256m"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: configs
              mountPath: /configs
          resources:
            requests:
              cpu: 100m
              memory: 896Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 50
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: configs
          persistentVolumeClaim:
            claimName: stirling-pdf-configs
