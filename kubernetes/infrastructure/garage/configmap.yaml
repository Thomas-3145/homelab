apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: garage
data:
  garage.toml: |
    metadata_dir = "/data/meta"
    data_dir = "/data/data"
    db_engine = "lmdb"
    replication_factor = 1

    rpc_bind_addr = "0.0.0.0:3901"
    rpc_public_addr = "garage.garage.svc.cluster.local:3901"
    # rpc_secret set via GARAGE_RPC_SECRET env var

    [s3_api]
    api_bind_addr = "0.0.0.0:3900"
    s3_region = "garage"

    [admin]
    api_bind_addr = "0.0.0.0:3903"
