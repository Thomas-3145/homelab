apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: coredns
  namespace: kube-system
spec:
  valuesContent: |-
    servers:
    - zones:
      - zone: .
        port: 53
        plugins:
        - name: errors
        - name: health
        - name: ready
        - name: kubernetes
          parameters: cluster.local in-addr.arpa ip6.arpa
          configBlock: |-
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        - name: prometheus
          parameters: 0.0.0.0:9153
        # Return NXDOMAIN for external AAAA queries - cluster has no IPv6 connectivity
        # and applications (e.g. cert-manager) timeout when trying IPv6 first.
        # Internal cluster.local AAAA queries are handled by the kubernetes plugin above.
        - name: template
          parameters: IN AAAA
          configBlock: |-
            rcode NXDOMAIN
        - name: forward
          parameters: . 1.1.1.1 8.8.8.8
        - name: cache
          parameters: 30
        - name: loop
        - name: reload
        - name: loadbalance
