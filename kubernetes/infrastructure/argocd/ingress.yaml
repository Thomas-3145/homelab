apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.3145.blog
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
  tls:
    - hosts:
        - argocd.3145.blog
      secretName: argocd-tls
---
# Public webhook endpoint so GitHub can push events instead of ArgoCD polling.
# Polling was silently serving a three-day-stale revision on 2026-09-02: the app
# reported Synced against ec279ab while main was already at 372e3ac, and only a
# hard refresh recovered it.
#
# The DNS record and the cloudflared route (router/cloudflared/config.yaml) have
# existed since 2026-08-21 but nothing ever terminated them — this Ingress is the
# missing half.
#
# SECURITY: pathType Exact on /api/webhook only. The 2026-08-21 exposure audit
# removed argocd.3145.blog from the tunnel precisely so the API and UI stop
# answering from the internet; a Prefix rule here would hand all of that straight
# back. Authentication is the shared secret in argocd-secret (webhook.github.secret),
# which ArgoCD verifies against GitHub's HMAC signature.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-webhook
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: argocd-webhook.3145.blog
      http:
        paths:
          - path: /api/webhook
            pathType: Exact
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
  tls:
    - hosts:
        - argocd-webhook.3145.blog
      secretName: argocd-webhook-tls
