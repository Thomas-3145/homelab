apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://charts.goauthentik.io
    chart: authentik
    targetRevision: 2025.12.4
    helm:
      releaseName: authentik
      valuesObject:
        global:
          envFrom:
            - secretRef:
                name: authentik-secrets

        authentik:
          log_level: info

        postgresql:
          enabled: true
          auth:
            username: authentik
            database: authentik
            existingSecret: authentik-secrets
            secretKeys:
              userPasswordKey: postgresql-password
          primary:
            persistence:
              storageClass: longhorn
              size: 8Gi
            resources:
              requests:
                memory: 128Mi
                cpu: 50m
              limits:
                memory: 512Mi
                cpu: 500m

        redis:
          enabled: true
          master:
            persistence:
              storageClass: longhorn
              size: 1Gi
            resources:
              requests:
                memory: 32Mi
                cpu: 10m
              limits:
                memory: 128Mi
                cpu: 100m

        # Scaled to zero 2026-07-20 — Authentik is deployed but unused, and the
        # worker was firing a permanent CPUThrottlingHigh alert. Postgres and its
        # PVC are left intact so the instance can be brought back with replicas: 1.
        server:
          replicas: 0
          ingress:
            enabled: false
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m

        worker:
          replicas: 0
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 200m
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
