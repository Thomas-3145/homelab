apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://charts.goauthentik.io
    chart: authentik
    targetRevision: 2025.12.4
    helm:
      releaseName: authentik
      valuesObject:
        global:
          envFrom:
            - secretRef:
                name: authentik-secrets

        authentik:
          log_level: info

        postgresql:
          enabled: true
          auth:
            username: authentik
            database: authentik
            existingSecret: authentik-secrets
            secretKeys:
              userPasswordKey: postgresql-password
          primary:
            persistence:
              storageClass: longhorn
              size: 8Gi
            resources:
              requests:
                memory: 128Mi
                cpu: 50m
              limits:
                memory: 512Mi
                cpu: 500m

        redis:
          enabled: true
          master:
            persistence:
              storageClass: longhorn
              size: 1Gi
            resources:
              requests:
                memory: 32Mi
                cpu: 10m
              limits:
                memory: 128Mi
                cpu: 100m

        # Brought back up 2026-08-20 to serve as SSO in front of the public apps.
        # The ingress lives in kubernetes/infrastructure/authentik/ingress.yaml
        # (auth.3145.blog), not here — the chart ingress stays disabled so there
        # is exactly one place that owns the host and the cert.
        #
        # The worker previously fired a permanent CPUThrottlingHigh alert at
        # 200m. Raised to 500m: authentik's worker is bursty (blueprint
        # reconciliation, outpost sync) and throttling it just makes the bursts
        # last longer without saving anything on an idle cluster.
        server:
          replicas: 1
          ingress:
            enabled: false
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m

        worker:
          replicas: 1
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
