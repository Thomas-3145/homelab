apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ibindex
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Thomas-3145/ibindex-app.git
    path: kubernetes
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: ibindex
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
