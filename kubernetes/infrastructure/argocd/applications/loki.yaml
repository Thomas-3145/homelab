apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.55.0
    helm:
      releaseName: loki
      valuesObject:
        deploymentMode: SingleBinary
        lokiCanary:
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        singleBinary:
          replicas: 1
          # NOTE: the PVC deliberately stays at 10Gi. Expanding it is blocked —
          # one of the three replicas lives on k3s-cp-02, and Longhorn rejects any
          # growth that would take a disk under its 25% floor (that node is already
          # at 23.1%). It is not needed either: Loki was dying of memory, not disk,
          # and retention below shrinks the volume on its own. Revisit once
          # Prometheus has moved off cp-02 and vda is mounted.
          resources:
            requests:
              memory: 192Mi
              cpu: 50m
            limits:
              # 512Mi was not enough to replay the WAL against a full disk —
              # 388 OOMKills in 46h. WAL replay is the memory peak, not steady state.
              memory: 1Gi
              cpu: 200m
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          storage:
            type: filesystem
          # Without these two blocks Loki never deletes anything. That is what
          # filled the volume and started the OOM loop — retention is not on by
          # default, and the compactor does not run retention unless told to.
          limits_config:
            retention_period: 336h  # 14d
          compactor:
            retention_enabled: true
            delete_request_store: filesystem
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
