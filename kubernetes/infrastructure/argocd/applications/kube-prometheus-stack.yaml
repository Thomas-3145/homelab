apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 72.9.1
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        prometheus:
          prometheusSpec:
            additionalScrapeConfigs:
              - job_name: node-exporter-physical
                static_configs:
                  - targets: ["192.168.10.11:9100"]
                    labels:
                      job: node-exporter
                      nodename: pve1
                  - targets: ["192.168.10.12:9100"]
                    labels:
                      job: node-exporter
                      nodename: pve2
                  - targets: ["192.168.10.13:9100"]
                    labels:
                      job: node-exporter
                      nodename: pve3
            resources:
              requests:
                memory: 512Mi
                cpu: 100m
              limits:
                memory: 1500Mi
                cpu: 500m
        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                memory: 32Mi
                cpu: 10m
              limits:
                memory: 128Mi
                cpu: 100m
          config:
            route:
              receiver: ntfy
              group_by: ['alertname', 'namespace']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                - receiver: ntfy
                  matchers:
                    - severity =~ "critical|warning"
            receivers:
              - name: ntfy
                webhook_configs:
                  - url: http://ntfy.ntfy.svc.cluster.local/homelab
                    send_resolved: true
        additionalPrometheusRulesMap:
          custom-alerts:
            groups:
              - name: node-alerts
                rules:
                  - alert: NodeDown
                    expr: up{job="node-exporter"} == 0
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Node {{ $labels.instance }} is down"
                      description: "Node exporter on {{ $labels.instance }} has been unreachable for 2 minutes."
                  - alert: NodeHighMemory
                    expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "High memory usage on {{ $labels.instance }}"
                      description: "Memory usage is above 90% on {{ $labels.instance }}."
                  - alert: NodeHighCPU
                    expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "High CPU usage on {{ $labels.instance }}"
                      description: "CPU usage is above 90% on {{ $labels.instance }}."
              - name: longhorn-alerts
                rules:
                  - alert: LonghornDiskSpaceLow
                    expr: (longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes) > 0.8
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Longhorn disk usage above 80% on {{ $labels.node }}"
                      description: "Longhorn disk on {{ $labels.node }} is {{ $value | humanizePercentage }} full."
                  - alert: LonghornDiskSpaceCritical
                    expr: (longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes) > 0.9
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Longhorn disk usage critical on {{ $labels.node }}"
                      description: "Longhorn disk on {{ $labels.node }} is {{ $value | humanizePercentage }} full."
                  - alert: LonghornVolumedegraded
                    expr: longhorn_volume_robustness == 2
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Longhorn volume {{ $labels.volume }} is degraded"
                      description: "Volume {{ $labels.volume }} has degraded robustness."
              - name: velero-alerts
                rules:
                  - alert: VeleroBackupFailed
                    expr: increase(velero_backup_failure_total{schedule="daily-cluster"}[2h]) > 0
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Velero backup failed"
                      description: "Schedule daily-cluster failed a backup in the last 2 hours."
                  - alert: VeleroBackupMissing
                    expr: time() - velero_backup_last_successful_timestamp{schedule="daily-cluster"} > 90000
                    for: 30m
                    labels:
                      severity: warning
                    annotations:
                      summary: "No successful Velero backup in 25 hours"
                      description: "Schedule daily-cluster has not completed a successful backup in over 25 hours."
              - name: cert-alerts
                rules:
                  - alert: CertificateExpiringSoon
                    expr: certmanager_certificate_expiration_timestamp_seconds - time() < 604800
                    for: 1h
                    labels:
                      severity: warning
                    annotations:
                      summary: "Certificate {{ $labels.name }} expires in less than 7 days"
                      description: "Certificate {{ $labels.name }} in namespace {{ $labels.namespace }} expires in {{ $value | humanizeDuration }}."
        grafana:
          admin:
            existingSecret: grafana-admin-secret
            userKey: admin-user
            passwordKey: admin-password
          resources:
            requests:
              memory: 256Mi
              cpu: 30m
            limits:
              memory: 600Mi
              cpu: 200m
          grafana.ini:
            auth.basic:
              enabled: true
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
            hosts:
              - grafana.3145.blog
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana.3145.blog
        nodeExporter:
          resources:
            requests:
              memory: 20Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 100m
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
