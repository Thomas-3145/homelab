---
extends: default

# Vendored verbatim from upstream releases. Upstream uses a different sequence
# indentation than this repo; reformatting would break `diff` against the release
# artifact, which is the whole point of vendoring.
ignore: |
  kubernetes/infrastructure/system-upgrade-controller/crd.yaml
  kubernetes/infrastructure/system-upgrade-controller/system-upgrade-controller.yaml

rules:
  line-length:
    max: 150
    level: warning
  document-start: disable
  truthy:
    check-keys: false
  # Required by ansible-lint
  braces:
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
