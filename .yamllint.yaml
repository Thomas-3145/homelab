---
extends: default

rules:
  line-length:
    max: 150
    level: warning
  document-start: disable
  truthy:
    check-keys: false
  # Required by ansible-lint
  braces:
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
