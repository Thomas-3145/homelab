---
# Common tasks applied to all managed hosts.
# - DNS fix (VLAN 10 can't reach AdGuard on VLAN 8)
# - System updates
# - Common packages
# - SSH authorized key

# -- DNS fix --
- name: Ensure resolved.conf.d directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"

- name: Configure DNS (systemd-resolved)
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/dns.conf
    content: |
      [Resolve]
      DNS=1.1.1.1 8.8.8.8
      FallbackDNS=9.9.9.9
    mode: "0644"
  notify: Restart systemd-resolved

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

# -- System updates --
- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

# -- Common packages --
- name: Install common packages
  ansible.builtin.apt:
    name:
      - curl
      - vim
      - git
      - htop
      - wget
    state: present

# -- SSH key --
- name: Add SSH authorized key
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ lookup('file', '~/.ssh/id_rsa_4096.pub') }}"
    state: present
