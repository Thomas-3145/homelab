---
# Common tasks applied to all managed hosts.
# - DNS fix (VLAN 10 can't reach AdGuard on VLAN 8)
# - System updates
# - Common packages
# - SSH authorized key
# - SSH hardening
# - Tailscale

# -- DNS fix --
- name: Ensure resolved.conf.d directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"

- name: Configure DNS (systemd-resolved)
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/dns.conf
    content: |
      [Resolve]
      DNS=1.1.1.1 8.8.8.8
      FallbackDNS=9.9.9.9
    mode: "0644"
  notify: Restart systemd-resolved

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

# -- System updates --
- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

# -- Common packages --
- name: Install common packages
  ansible.builtin.apt:
    name:
      - curl
      - vim
      - git
      - htop
      - wget
      # apt_repository (used for the Tailscale repo below) shells out to gpg.
      # Ubuntu cloud images ship it; the Debian genericcloud image does not,
      # so install it explicitly. No-op on the Ubuntu hosts.
      - gnupg
    state: present

# -- QEMU guest agent (VMs only) --
# Without it Proxmox cannot freeze the filesystem before a vzdump snapshot, so
# backups are crash-consistent rather than filesystem-consistent. Skipped on the
# LXC guests (arr-stack, ai-lab, whisper), where a QEMU agent has no meaning.
# NOTE: the agent only becomes usable once the VM also has `agent: enabled=1` in
# its Proxmox config AND has been power-cycled — the virtio-serial port is added
# at machine start, so a reboot from inside the guest is not enough.
# Tagged so they can be applied on their own with `--tags qemu-agent`, without
# triggering this role's `upgrade: dist` on a running cluster.
- name: Install qemu-guest-agent
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
  when: ansible_virtualization_type != 'lxc'
  tags: qemu-agent

- name: Enable qemu-guest-agent
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
  when: ansible_virtualization_type != 'lxc'
  tags: qemu-agent

# The service requires the virtio-serial port, which QEMU only creates when the
# VM has `agent: enabled=1` in its Proxmox config and has been power-cycled
# (a reboot from inside the guest does not add the device). Starting it before
# then fails with "a dependency job failed", so gate the start on the port.
- name: Check for the guest-agent virtio port
  ansible.builtin.stat:
    path: /dev/virtio-ports/org.qemu.guest_agent.0
  register: common_qga_port
  when: ansible_virtualization_type != 'lxc'
  tags: qemu-agent

- name: Start qemu-guest-agent
  ansible.builtin.systemd:
    name: qemu-guest-agent
    state: started
  when:
    - ansible_virtualization_type != 'lxc'
    - common_qga_port.stat.exists | default(false)
  tags: qemu-agent

# -- SSH key --
- name: Add SSH authorized key
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ lookup('file', '~/.ssh/id_rsa_4096.pub') }}"
    state: present

# -- SSH hardening --

- name: Configure SSH port and disable password auth
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  loop:
    - {regexp: '^#?Port ', line: 'Port 22456'}
    - {regexp: '^#?PasswordAuthentication ', line: 'PasswordAuthentication no'}
  notify: Restart sshd

# -- Security --
- name: Install fail2ban and unattended-upgrades
  ansible.builtin.apt:
    name:
      - fail2ban
      - unattended-upgrades
    state: present
    update_cache: true

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

- name: Enable unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

# -- Tailscale --
- name: Load Tailscale secrets
  community.sops.load_vars:
    file: "{{ inventory_dir }}/group_vars/proxmox_vms/vault.sops.yaml"
  no_log: true

- name: Add Tailscale GPG key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu noble main"
    filename: tailscale
    state: present

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    update_cache: true
    state: present

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check if already connected to Tailscale
  ansible.builtin.command: tailscale status
  register: common_tailscale_status
  changed_when: false
  failed_when: false

- name: Connect to Tailscale
  ansible.builtin.command: tailscale up --authkey {{ vault_tailscale_authkey }}
  register: common_tailscale_up
  when: common_tailscale_status.rc != 0
  changed_when: common_tailscale_status.rc != 0
  # Fail-soft: an expired/used auth key must not abort the whole play. If it did,
  # end-of-play handlers (incl. the sshd restart onto port 22456) would never run,
  # leaving the node with a half-applied SSH config and locked out.
  failed_when: false
  no_log: true

- name: Warn if Tailscale connect failed (likely expired/used auth key)
  ansible.builtin.debug:
    msg: >-
      Tailscale connect failed — the auth key is probably expired or used. Generate
      a new key in the Tailscale admin console, update
      inventory/group_vars/proxmox_vms/vault.sops.yaml, and re-run. All other
      config (SSH hardening, packages, etc.) was still applied.
  when:
    - common_tailscale_status.rc != 0
    - common_tailscale_up.rc | default(0) != 0
