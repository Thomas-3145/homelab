---
# Models pulled into Ollama. Both are kept while they are compared head to head:
#
#   llama3.3:70b     dense, ~42 GB — every parameter is read per token, so generation
#                    is capped by memory bandwidth at 42 GB / 77 GB/s ≈ 1.8 tok/s.
#   qwen3.6:35b-a3b  MoE, ~22 GB — 34.7B parameters but only ~3B active per token, so
#                    far less is read per token. Should be an order of magnitude faster.
#
# Quality is the open question, not speed: llama3.3 is a late-2024 dense model, qwen3.6
# is 2026 but activates fewer parameters. Measure before picking a winner.
ai_lab_llm_models:
  - "llama3.3:70b"
  - "qwen3.6:35b-a3b"
  - "{{ ai_lab_embedding_model }}"

# Embedding model backing Open WebUI's RAG. Small (~275 MB) and served by the same
# Ollama instance, so there is only one model store to manage.
ai_lab_embedding_model: "nomic-embed-text"

# Open WebUI listens on the LAN address only — see the compose template for why.
ai_lab_lan_ip: "192.168.10.41"
ai_lab_openwebui_port: 3000

# The one the studieplugg pipeline actually uses — switching is a one-line change.
# Measured against llama3.3:70b on the same lecture with the same inputs: 21x faster,
# and better output. It pulled the lecturer names, course code and excursion dates out
# of the slide PDF, and corrected "van der Waals" where Whisper had heard "vannevals"
# and the 70B had copied the error through.
ai_lab_llm_model: "qwen3.6:35b-a3b"

# Context window for the pipeline. 8192 came from llama3.3:70b, whose KV cache at
# 32768 OOM-killed the server on this LXC's 52 GB. It is too small for the MoE: a
# lecture reduce step measured a 6841-token prompt (four partial summaries plus the
# slide-PDF reference), leaving 1351 tokens for the answer and truncating the summary
# mid-heading. The MoE's KV cache is a fraction of the 70B's, so it has the headroom.
#
# Drop this back to 8192 if switching the pipeline to llama3.3:70b.
ai_lab_num_ctx: 32768

# Transcripts longer than this get map-reduced; shorter ones are summarised in a single
# pass. A lecture now fits in 32768 whole, so single-pass is possible — but measured
# worse. Raising this to 14000 dropped the course code, the excursion details and the
# Oddo-Harkins rule from the F1 summary.
#
# Map-reduce has a property that looked like pure loss but is not: it *guarantees
# coverage*. Every chunk is summarised on its own, so nothing can be skipped. Given the
# whole transcript at once the model compresses harder and picks what to keep.
#
# Keep 3000 unless someone re-measures output quality, not just speed.
ai_lab_chunk_words: 3000

# Vision: send the figure-heavy slides to the model as images alongside the extracted
# text. pdftotext gets the words but drops everything drawn — structural formulas,
# phase diagrams, abundance plots, the periodic table figures — which on a chemistry
# course is a lot of the content.
#
# Pages are picked by how many images they embed (pdfimages), not by how little text
# they hold: "least text" selects blank and transition slides.
#
# OFF by default: measured, it made the F1 summary worse, not better. Eight images cost
# ~6000 context tokens and cut generation from 14.2 to 5.0 tok/s, and the slide text
# they were meant to complement got crowded out — every course detail disappeared.
#
# The mechanism was never isolated (the same run also switched to single-pass), so this
# is worth revisiting with one variable at a time. Until then it stays off.
ai_lab_vision_slides: 0
ai_lab_vision_width: 1024

# Ollama threads. Measured on qwen3.6:35b-a3b over the six P-cores (host CPUs 0-5,
# which the studieplugg helpers pin the LXC to for the duration of a run):
#
#   6 threads   89.0 prefill / 14.2 generation   <- best
#   5 threads   78.4 / 13.5
#   14 threads  86.2 /  6.3
#
# Generation is a per-token barrier and does not parallelise; extra threads only add
# synchronisation cost. Prefill does scale, but not enough to pay for the loss.
#
# Never run 8 threads against the E-core set (host CPUs 6-13): that combination
# measured 0.22 and 0.25 tok/s across two runs — some 50x worse than 6 threads on the
# same cores, with normal prefill. Reproducible, and unexplained.
ai_lab_num_thread: 6

# The whisper-ov service in this LXC, 3.3x faster than the pve3 one it replaced with
# no loss of content (see the measurements further down). localhost, not the LAN
# address: the pipeline runs inside this LXC, so this saves uploading every lecture
# part over the network to reach a service on the same host.
#
# pve3 (LXC 202) is still running and still correct — point this at
# http://192.168.10.42:9000 to fall back to it.
ai_lab_whisper_url: "http://localhost:9000"

# Ollama stores each model layer as a plain file under models/blobs; the layer with
# mediaType application/vnd.ollama.image.model *is* the GGUF. llama.cpp can read it
# directly, so the benchmark container reuses what Ollama already downloaded instead
# of keeping a second multi-GB copy.
# Assumes a library model (no namespace). A user-namespaced model such as
# someone/model would live under registry.ollama.ai/someone/model/<tag> instead.
ai_lab_ollama_manifest: >-
  /opt/ai-lab/ollama/models/manifests/registry.ollama.ai/library/{{ ai_lab_llm_model | replace(':', '/') }}

# Resolved from the manifest above at run time; empty until the model has been pulled,
# which leaves the llamacpp service out of the compose file entirely.
ai_lab_model_blob: ""

# llama.cpp with the Vulkan backend, to measure what the Arrow Lake iGPU is worth on
# prompt processing versus Ollama's CPU path. Behind the 'bench' compose profile — see
# the template for why it must not run alongside Ollama.
ai_lab_llamacpp_image: "ghcr.io/ggml-org/llama.cpp:server-vulkan"
ai_lab_llamacpp_port: 8080
ai_lab_llamacpp_ctx: 8192      # matches NUM_CTX in the studieplugg pipeline
ai_lab_llamacpp_threads: 6     # LXC 201 has 6 cores
ai_lab_llamacpp_ngl: 99        # offload everything; lower it if the iGPU can't allocate

# ntfy topic pinged when a pipeline run finishes (empty = no notification).
# The public hostname doesn't hairpin from inside the LAN, so reach ntfy via the
# ingress-nginx LB IP using --resolve (keeps the valid ntfy.3145.blog TLS cert).
ai_lab_ntfy_url: "https://ntfy.3145.blog/studieplugg"
ai_lab_ntfy_resolve: "ntfy.3145.blog:443:192.168.10.200"

# --- Whisper through OpenVINO ------------------------------------------------------
# One image, one device knob. large-v3 int8 on pve2's E-cores is what the pipeline
# uses; NPU and GPU stay reachable by changing ai_lab_whisper_ov_device alone.
#
# WHY CPU AND NOT THE NPU. The NPU is much faster, and unusable anyway:
#
#   NPU  + large-v3-turbo-int8       12.1x realtime   pve2 at ~49 C
#   CPU  + large-v3-turbo-int8        8.1x realtime   pve2 at  77 C
#   CPU  + large-v3 int8              3.8x realtime   <- in use, pve2 at 68 C
#   pve3 + large-v3 (faster_whisper)  1.2x realtime
#
# The last two rows are a head-to-head on F2_del_3 (1683 s), both services running at
# once on their own hosts, 2026-08-23: 441 s here against 1441 s on pve3. That is 3.3x,
# and it is the whole reason transcription came back to pve2. The old "pve3 does 1.4x"
# figure came off a 300 s slice; over a full lecture it is 1.2x.
#
# turbo silently drops passages. On a 5-minute sample it looked like a clean 95.0%
# word-level match with large-v3; on the full F2 lecture (1h54m) it is 91.9%, and the
# gap is not cosmetic — two passages of ~50 words each went missing, one of them the
# silver-in-lead-ore reasoning behind alchemical transmutation. Exactly the kind of
# course content these transcripts exist to capture. Short samples lie; measure on a
# whole lecture.
#
# Isolated over F2_del_3 (1683 s), the dropped passage is present or absent as:
#
#   turbo int8, NPU                    142 s   absent
#   turbo int8, NPU, return_timestamps 164 s   absent
#   turbo int8, CPU                    210 s   absent
#   turbo fp16, NPU                    156 s   absent
#   large-v3 int8, CPU                 441 s   PRESENT
#   large-v3 int8, NPU                    —    fails to execute on this NPU
#
# So it is the turbo architecture, not the accelerator, the precision or the chunking.
# large-v3 keeps the content but compiles-then-dies on this NPU at graph execute
# (ZE_RESULT_ERROR_UNINITIALIZED) regardless of audio length. The NPU path is locked
# to a model that loses text, which is why the slower CPU device is the one in use.
#
# GPU WORKS as of 2026-08-25, and is the fastest device that keeps the text. Two things
# had to be fixed to get there, both of which looked like "the GPU is unsupported":
#
#   1. The image had no GPU backend at all — the Dockerfile installed only the NPU
#      user-mode stack, so the plugin had nothing to bind to and available_devices
#      returned ['CPU'] even with /dev/dri passed in. The compose template also only
#      added a device for NPU, so setting GPU would not have got /dev/dri anyway.
#   2. Ubuntu 24.04's archive compute-runtime (23.43, Nov 2023) enumerates Arrow Lake
#      correctly but SIGSEGVs at model compile ("longjmp causes uninitialized stack
#      frame") against openvino-genai 2026.2.1. Intel's own packages fix it.
#
# Measured on F2_del_3 (1683 s), the same file as every other row here:
#
#   GPU  + large-v3 int8   386 s   4.36x realtime   <- P-cores 20.7%, iGPU 2000 MHz
#   CPU  + large-v3 int8   441 s   3.82x realtime      P-cores ~92%
#
# 386 s and 388 s across two runs, one of them with llama-server busy on the CPU —
# the timing is reproducible and the LLM does not disturb it, which is the point.
#
# The wall-clock gain is only 12.5%. The reason to switch is the other column: on GPU
# the transcription leaves the P-cores free, so Whisper and the model stop competing
# for the same six cores. On CPU they cannot run at once without both slowing down.
#
# Content is equivalent, checked the same way the turbo model was rejected: 98.4%
# word-level match against the CPU output, longest run present in only one of them
# 5 words, and zero differences of 8 words or more. Compare with CPU-vs-pve3 at 94.8%
# and a 9-word longest run. This is not the turbo trap again.
#
# Not yet checked on a full 1h54m lecture — F2_del_3 is 28 minutes. The turbo lesson
# says short samples lie, so run one whole lecture through both devices before
# trusting this for a term's worth of transcripts.
ai_lab_whisper_ov_enabled: true
ai_lab_whisper_ov_port: 9000
ai_lab_whisper_ov_model: "OpenVINO/whisper-large-v3-int8-ov"
# NPU and GPU are valid values. Both are also the isolation knob when something
# regresses: same model, different device tells you whether it is the model's fault.
# The compose template adds the right passthrough per device: /dev/accel for NPU,
# /dev/dri for GPU. Switching device is a variable change and a rebuild is not needed
# — both user-mode stacks are in the image.
ai_lab_whisper_ov_device: "CPU"
ai_lab_whisper_ov_language: "sv"

# Intel's GPU compute runtime, pinned as a group the same way. compute-runtime's
# release notes name the exact intel-graphics-compiler and gmmlib builds it was made
# against — take all four from one release or expect the GPU to vanish or crash.
# Ubuntu's archive build is far too old; see the Dockerfile for what that looks like.
ai_lab_compute_runtime_version: "26.27.39122.11"
ai_lab_igc_version: "2.38.2"
ai_lab_igc_build: "22051"
ai_lab_gmmlib_version: "22.10.0"

# Pinned to the set Intel validated together for Arrow Lake in linux-npu-driver
# v1.35.0. The kernel-mode driver and firmware come from the PVE host; these are the
# user-mode halves. Bump them as a group, never individually.
ai_lab_npu_driver_version: "1.35.0"
ai_lab_npu_driver_tarball: "linux-npu-driver-v1.35.0.20260722-29947505341-ubuntu2404.tar.gz"
ai_lab_level_zero_version: "1.28.2"
ai_lab_openvino_version: "2026.2.1.0"
