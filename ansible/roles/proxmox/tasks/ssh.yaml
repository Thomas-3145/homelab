---
# SSH hardening for Proxmox hosts.
#
# The base hardening (root key, password auth off, fail2ban, unattended-upgrades)
# is cluster-safe: PermitRootLogin is left untouched so Proxmox's inter-node SSH
# (which authenticates with root keys) keeps working. The sshd restart at the end
# of the play keeps the current Ansible connection alive; only NEW connections are
# briefly affected.
#
# Port change (opt-in via proxmox_ssh_change_port, default false):
#   UNSAFE on a clustered node — Proxmox connects to peers on port 22 for
#   migration / `pvecm` / cross-node shell. Only enable on a standalone host.
#   Bootstrap when you do:
#     1. inventory has ansible_port: 22 for the host
#     2. run with proxmox_ssh_change_port=true — sets Port {{ proxmox_ssh_port }}
#        and notifies "Restart sshd" (fires at end of play, current session survives)
#     3. after a successful run, set ansible_port: {{ proxmox_ssh_port }} in inventory
#   Updating the inventory port BEFORE the first run will fail (sshd still on 22).

- name: Add SSH authorized key for root
  ansible.posix.authorized_key:
    user: root
    key: "{{ lookup('file', proxmox_ssh_authorized_key_file) }}"
    state: present

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication '
    line: 'PasswordAuthentication no'
    state: present
  notify: Restart sshd

- name: Change SSH port (opt-in — unsafe on clustered Proxmox nodes)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?Port '
    line: "Port {{ proxmox_ssh_port }}"
    state: present
  when: proxmox_ssh_change_port | bool
  notify: Restart sshd

- name: Install fail2ban and unattended-upgrades
  ansible.builtin.apt:
    name:
      - fail2ban
      - unattended-upgrades
    state: present

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  # In --check mode the previous apt task does not actually install the
  # package, so systemd cannot find the unit. Tolerate that — a real run
  # installs fail2ban first and the service is available.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Enable unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"
