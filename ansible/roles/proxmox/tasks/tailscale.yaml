---
# Tailscale install + connect.
#
# Reads vault_tailscale_authkey from the proxmox_vms group vault — the same
# key works for physical hosts. The `tailscale up` step is idempotent: it
# only runs when `tailscale status` returns non-zero (= not connected).
#
# Proxmox 9 is Debian 13 (trixie), but Tailscale's apt repos are organized
# per Debian codename — use trixie.

- name: Load Tailscale secrets
  community.sops.load_vars:
    file: "{{ proxmox_tailscale_vault_file }}"
  no_log: true

- name: Add Tailscale GPG key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian trixie main"
    filename: tailscale
    state: present

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    update_cache: true
    state: present

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check if already connected to Tailscale
  ansible.builtin.command: tailscale status
  register: proxmox_tailscale_status
  changed_when: false
  failed_when: false

- name: Connect to Tailscale
  ansible.builtin.command: tailscale up --authkey {{ vault_tailscale_authkey }}
  when: proxmox_tailscale_status.rc != 0
  changed_when: proxmox_tailscale_status.rc != 0
  no_log: true
