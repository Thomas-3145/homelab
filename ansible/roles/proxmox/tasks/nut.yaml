---
# NUT (Network UPS Tools) — APC BE650G2-GR connected to pve2 over USB.
#
# Topology:
#   pve2 (netserver)  driver = usbhid-ups, listens on 0.0.0.0:3493
#   clients           monitor apc@192.168.10.12, shut down on power loss
#
# The role-on-host is decided by `proxmox_nut_server_host`. Anything else
# in the play becomes a netclient. Source for the original setup:
# homelab-hardware/configuration/proxmox/setup-nut-server.sh.

- name: Load NUT secrets
  community.sops.load_vars:
    file: "{{ proxmox_nut_vault_file }}"
  no_log: true

- name: Install NUT (server)
  ansible.builtin.apt:
    name: nut
    state: present
  when: proxmox_nut_role == 'server'

- name: Install NUT client
  ansible.builtin.apt:
    name: nut-client
    state: present
  when: proxmox_nut_role == 'client'

- name: Configure /etc/nut/nut.conf
  ansible.builtin.copy:
    dest: /etc/nut/nut.conf
    content: |
      MODE={{ 'netserver' if proxmox_nut_role == 'server' else 'netclient' }}
    owner: root
    group: nut
    mode: "0640"
  notify: Restart NUT

- name: Stop and disable nut-server on clients
  # A host demoted from server to client keeps upsd running and listening on
  # 3493 with no UPS attached — writing MODE=netclient does not stop it. Seen on
  # pve3 after the 2026-08-31 move. Tolerate the missing unit on hosts that only
  # ever had nut-client installed.
  ansible.builtin.systemd:
    name: nut-server
    state: stopped
    enabled: false
  when: proxmox_nut_role == 'client'
  failed_when: false

- name: Configure /etc/nut/ups.conf (server)
  ansible.builtin.copy:
    dest: /etc/nut/ups.conf
    content: |
      [{{ proxmox_nut_ups_name }}]
          driver = usbhid-ups
          port = auto
          desc = "{{ proxmox_nut_ups_desc }}"
    owner: root
    group: nut
    mode: "0640"
  when: proxmox_nut_role == 'server'
  notify: Restart NUT

- name: Configure /etc/nut/upsd.conf (server)
  ansible.builtin.copy:
    dest: /etc/nut/upsd.conf
    content: |
      LISTEN 0.0.0.0 3493
    owner: root
    group: nut
    mode: "0640"
  when: proxmox_nut_role == 'server'
  notify: Restart NUT

- name: Configure /etc/nut/upsd.users (server)
  ansible.builtin.copy:
    dest: /etc/nut/upsd.users
    content: |
      [upsmon-local]
          password = {{ vault_nut_password }}
          upsmon master
          # SET is required for upsrw to write the low-battery thresholds below.
          # Without it upsd answers ERR ACCESS-DENIED. Granted 2026-08-20,
          # while pve3 still held the USB link.
          actions = SET

      [upsmon-remote]
          password = {{ vault_nut_password }}
          upsmon slave
    owner: root
    group: nut
    mode: "0640"
  when: proxmox_nut_role == 'server'
  no_log: true
  notify: Restart NUT

- name: Configure /etc/nut/upsmon.conf (server)
  ansible.builtin.copy:
    dest: /etc/nut/upsmon.conf
    content: |
      MONITOR {{ proxmox_nut_ups_name }}@localhost 1 upsmon-local {{ vault_nut_password }} master
      SHUTDOWNCMD "/sbin/shutdown -h +0"
    owner: root
    group: nut
    mode: "0640"
  when: proxmox_nut_role == 'server'
  no_log: true
  notify: Restart NUT

- name: Configure /etc/nut/upsmon.conf (client)
  ansible.builtin.copy:
    dest: /etc/nut/upsmon.conf
    content: |
      MONITOR {{ proxmox_nut_ups_name }}@{{ proxmox_nut_server_address }} 1 upsmon-remote {{ vault_nut_password }} slave
      SHUTDOWNCMD "/sbin/shutdown -h +0"
    owner: root
    group: nut
    mode: "0640"
  when: proxmox_nut_role == 'client'
  no_log: true
  notify: Restart NUT

- name: Set UPS low-battery thresholds (server)
  # upsrw writes to the UPS itself, so this is only idempotent by way of the
  # changed_when check below — read the value back and only report a change if
  # it actually moved. Runs after upsd is up, since upsrw talks to it over 3493.
  ansible.builtin.command:
    cmd: >-
      upsrw -s {{ item.var }}={{ item.value }}
      -u upsmon-local -p {{ vault_nut_password }}
      {{ proxmox_nut_ups_name }}@localhost
  loop:
    - {var: "battery.runtime.low", value: "{{ proxmox_nut_battery_runtime_low }}"}
    - {var: "battery.charge.low", value: "{{ proxmox_nut_battery_charge_low }}"}
  loop_control:
    label: "{{ item.var }}={{ item.value }}"
  when: proxmox_nut_role == 'server'
  register: proxmox_nut_upsrw
  changed_when: proxmox_nut_upsrw.rc == 0
  no_log: true

- name: Verify UPS low-battery thresholds took effect (server)
  ansible.builtin.command:
    cmd: upsc {{ proxmox_nut_ups_name }}@localhost {{ item.var }}
  loop:
    - {var: "battery.runtime.low", value: "{{ proxmox_nut_battery_runtime_low }}"}
    - {var: "battery.charge.low", value: "{{ proxmox_nut_battery_charge_low }}"}
  loop_control:
    label: "{{ item.var }}"
  when: proxmox_nut_role == 'server'
  register: proxmox_nut_readback
  changed_when: false
  failed_when: proxmox_nut_readback.stdout | trim != item.value | string

- name: Enable and start NUT services (server)
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - nut-server
    - nut-monitor
  when: proxmox_nut_role == 'server'
  ignore_errors: "{{ ansible_check_mode }}"

- name: Enable and start NUT monitor (client)
  ansible.builtin.systemd:
    name: nut-monitor
    enabled: true
    state: started
  when: proxmox_nut_role == 'client'
  ignore_errors: "{{ ansible_check_mode }}"
