---
# APT repos — switch from enterprise (paid) to no-subscription
proxmox_pve_suite: trixie  # Debian 13 / Proxmox VE 9

# Kernel pin — 6.17.13 triggers e1000e Hardware Unit Hang on HP EliteDesk G4.
# 6.17.9-1-pve is the last known-good version.
proxmox_pinned_kernel: 6.17.9-1-pve

# UI — remove the "No valid subscription" popup on every login
proxmox_disable_subscription_popup: true

# e1000e workaround — disable EEE/TSO/GRO on the affected NIC
proxmox_e1000e_workaround_enabled: true
proxmox_e1000e_nic_name: nic0

# CPU sustained power limit (RAPL PL1) in watts — opt-in, empty = leave BIOS default.
# pve2 has a 65 W desktop CPU (Core Ultra 5 235) in the same mini chassis that pve1
# and pve3 use for 35 W T-processors. Under sustained all-core load it climbs to
# 100 °C without finding a plateau and throttles hundreds of times, which makes every
# measurement a measurement of the cooler rather than the CPU. Capping PL1 near what
# the chassis can actually dissipate trades peak turbo for a stable clock — and for
# workloads that already thermally throttle, that is usually a net *gain* in
# sustained throughput. Verify with scripts/llm-bench.sh before trusting a value.
proxmox_power_limit_watts: ""
# Kernel tunables, written as one drop-in in /etc/sysctl.d. Empty = change nothing.
#
# vm.swappiness — Debian ships 60, which is tuned for a desktop where swapping an idle
# application out to make room for page cache is a win. On a hypervisor the "idle
# application" is a guest's memory, and paging that to disk turns a guest's RAM access
# into a disk seek that the guest cannot see or account for; it shows up inside the
# guest as unexplained latency. 10 keeps swap as an emergency reserve rather than a
# routine tier. It is not 0: that would leave no headroom before the OOM killer, and
# pve2's ai-lab LXC has a 52 GB cap on a 62 GB host.
proxmox_sysctl_settings: {}

proxmox_power_limit_sysfs: /sys/class/powercap/intel-rapl:0/constraint_0_power_limit_uw

# SSH hardening — key-only root, password auth off, fail2ban, unattended-upgrades.
# All of this is safe on a clustered Proxmox node (inter-node SSH uses root keys,
# which are left working).
proxmox_ssh_hardening_enabled: false

# Changing sshd's listening port is a SEPARATE, opt-in step and is UNSAFE on a
# clustered node: Proxmox connects to peer nodes over SSH on port 22 for
# migration, `pvecm`, and the cross-node shell. Leave this false on the 3-node
# cluster — the port stays 22 while the rest of the hardening still applies.
# See tasks/ssh.yaml for the bootstrap procedure if you ever enable it on a
# standalone host (the inventory port must then be updated to match).
proxmox_ssh_change_port: false
proxmox_ssh_port: 22456
proxmox_ssh_authorized_key_file: ~/.ssh/id_rsa_4096.pub

# Tailscale — opt-in. Reads the auth key from the proxmox_vms group vault
# (same key works for physical hosts).
proxmox_tailscale_enabled: false
proxmox_tailscale_vault_file: "{{ inventory_dir }}/group_vars/proxmox_vms/vault.sops.yaml"

# NUT (Network UPS Tools) — opt-in. The netserver is whichever host holds the
# USB link to the UPS; every other host in the play becomes a netclient over
# the LAN. Reads vault_nut_password from the proxmox_vms group vault.
#
# Moved pve3 → pve2 on 2026-08-31. The 2026-08-31 power cut killed pve3 hard
# (its journal ends mid-line, no shutdown sequence) while pve1 and pve2 never
# so much as rebooted — so pve3 was not actually on a battery outlet, and the
# UPS monitoring lived on the one node guaranteed to die first. pve2 is also
# the newest hardware (Core Ultra 5 235) and pve1 is being sold.
#
# NOTE: moving this variable is not enough on its own — the UPS USB cable has
# to be physically moved to the new server host as well.
proxmox_nut_enabled: false
proxmox_nut_vault_file: "{{ inventory_dir }}/group_vars/proxmox_vms/vault.sops.yaml"
proxmox_nut_server_host: pve2
proxmox_nut_server_address: 192.168.10.12
proxmox_nut_ups_name: apc
proxmox_nut_ups_desc: APC BE650G2-GR
# Low-battery thresholds. These live ON THE UPS (settable via upsrw), not in a
# config file, so without this task they survive reboots but are lost if the unit
# is replaced — and they are invisible to code review.
#
# The stock 120 s is too little. Worst case for the server's shutdown chain
# (5 guests, 4 parallel workers, 180 s per-guest cap) is ~6 min, so the UPS must
# declare LB with at least that much runtime left. 420 s = 7 min. Re-checked for
# pve2 on 2026-08-31: it also tops out at 5 guests, so 420 s still holds.
#
# Only meaningful on the server (it holds the USB link to the UPS).
proxmox_nut_battery_runtime_low: 420
proxmox_nut_battery_charge_low: 10
# Lazy-evaluated per host: anything matching proxmox_nut_server_host is the
# server, everything else is a client.
proxmox_nut_role: "{{ 'server' if inventory_hostname == proxmox_nut_server_host else 'client' }}"

# NUT exporter — Prometheus exporter for UPS metrics, runs only on the NUT server host.
proxmox_nut_exporter_enabled: false
proxmox_nut_exporter_version: "3.2.5"
proxmox_nut_exporter_port: 9199
proxmox_nut_exporter_vars: "battery.charge,battery.runtime,input.voltage,output.voltage,ups.load,ups.status"
