---
# Tasks applied to all k3s nodes (control plane and workers).
# - Disable swap (required by Kubernetes)
# - Set hostname to match inventory

- name: Disable swap (runtime)
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Remove swap from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '\sswap\s'
    state: absent

- name: Disable dphys-swapfile (Raspberry Pi OS)
  ansible.builtin.systemd:
    name: dphys-swapfile
    state: stopped
    enabled: false
  failed_when: false

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

# Optional per-node taints, set via the `k3s_node_taints` inventory var.
# k3s reads /etc/rancher/k3s/config.yaml on start and reconciles node taints
# from it, so this is the IaC-authoritative source (survives reboots/rejoin).
- name: Ensure k3s config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"
  when:
    - k3s_node_taints is defined
    - k3s_node_taints | length > 0

- name: Configure k3s node taints
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
    content: |
      # Managed by Ansible (k3s_node role) — do not edit by hand.
      node-taint:
      {% for taint in k3s_node_taints %}
        - "{{ taint }}"
      {% endfor %}
  when:
    - k3s_node_taints is defined
    - k3s_node_taints | length > 0
  notify: Restart k3s-agent
