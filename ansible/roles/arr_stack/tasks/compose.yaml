---
- name: Create config directories
  ansible.builtin.file:
    path: "/opt/arr-stack/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - jellyfin
    - sonarr
    - radarr
    - prowlarr
    - qbittorrent
    - bazarr
    - flaresolverr

- name: Create media directories
  ansible.builtin.file:
    path: "/mnt/media/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - movies
    - tv
    - downloads

- name: Create compose directory
  ansible.builtin.file:
    path: /opt/arr-stack
    state: directory
    mode: "0755"

- name: Deploy docker-compose.yaml
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: /opt/arr-stack/docker-compose.yaml
    mode: "0644"
  notify: Restart arr-stack

- name: Start arr-stack
  community.docker.docker_compose_v2:
    project_src: /opt/arr-stack
    state: present
    pull: missing
