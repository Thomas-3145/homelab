---
- name: Create config directories
  ansible.builtin.file:
    path: "/opt/arr-stack/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - jellyfin
    - sonarr
    - radarr
    - prowlarr
    - qbittorrent
    - bazarr
    - flaresolverr
    - seerr

# The Seerr image runs as the unprivileged node user (uid 1000) and, unlike the
# linuxserver images, does not chown its own config dir — it must be writable.
- name: Ensure seerr config directory is owned by the node user
  ansible.builtin.file:
    path: /opt/arr-stack/seerr
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Create media directories
  ansible.builtin.file:
    path: "/mnt/media/{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    # TRaSH layout: torrents and library share one tree so the *arr apps and
    # qBittorrent see identical paths under /data, enabling hardlinks/instant moves.
    - torrents
    - media/tv
    - media/movies

- name: Create compose directory
  ansible.builtin.file:
    path: /opt/arr-stack
    state: directory
    mode: "0755"

- name: Deploy docker-compose.yaml
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: /opt/arr-stack/docker-compose.yaml
    mode: "0644"
  notify: Restart arr-stack

- name: Start arr-stack
  community.docker.docker_compose_v2:
    project_src: /opt/arr-stack
    state: present
    pull: missing
