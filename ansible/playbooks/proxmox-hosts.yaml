---
# Proxmox host hardening (idempotent base layer + opt-in extras).
# Targets pve1, pve2, pve3 directly — the `physical_hosts` group historically
# also included 3145 (Raspberry Pi 5, decommissioned), so we list hosts
# explicitly rather than using the group.
#
# Run with:
#   ansible-playbook -i inventory/hosts.yaml playbooks/proxmox-hosts.yaml
#
# Recommended: --check --diff first, then apply one node at a time, pve2 or
# pve3 before pve1 (pve1 hosts k3s-cp-01 and k3s-worker-01 — higher blast
# radius). Use --limit pve3 to stage it.
#
# SSH hardening is ON here: adds the root key, disables password auth, installs
# fail2ban + unattended-upgrades. It deliberately does NOT change the sshd port
# (proxmox_ssh_change_port stays false) because Proxmox uses port-22 SSH between
# cluster nodes for migration / pvecm — so the hosts stay on port 22 and the
# inventory needs no change. PermitRootLogin is left untouched so inter-node
# root-key SSH keeps working.
#
# Opt-in extras (toggle below or via --extra-vars):
#   - Tailscale: installs and connects via the proxmox_vms group vault
#     (community.sops required, age key present).
#   - NUT: pve2 = netserver (USB UPS), pve1/pve3 = netclients over the LAN.
#     Reads vault_nut_password from the proxmox_vms group vault.

- name: Configure Proxmox hosts (apt repos, kernel pin, EEE workaround, SSH hardening)
  hosts: pve1,pve2,pve3
  become: true
  gather_facts: true
  roles:
    - role: proxmox
      vars:
        proxmox_ssh_hardening_enabled: true
        proxmox_ssh_change_port: false # keep port 22 — cluster inter-node SSH
        proxmox_tailscale_enabled: false
        proxmox_nut_enabled: false
