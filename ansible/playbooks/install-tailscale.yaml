---
# Installs and configures Tailscale on all Proxmox-managed VMs.
# Run: ansible-playbook -i inventory/hosts.yaml playbooks/install-tailscale.yaml
#
# Prerequisites:
#   - Install collection: ansible-galaxy collection install -r requirements.yaml
#   - Create an auth key at https://login.tailscale.com/admin/settings/keys (reusable, ephemeral off)
#   - Create and encrypt the vars file:
#       mkdir -p inventory/group_vars/proxmox_vms
#       echo 'vault_tailscale_authkey: "tskey-auth-xxxx"' > inventory/group_vars/proxmox_vms/vault.sops.yaml
#       sops -e -i inventory/group_vars/proxmox_vms/vault.sops.yaml

- name: Install Tailscale on all Proxmox VMs
  hosts: proxmox_vms
  become: true

  tasks:
    - name: Load secrets
      community.sops.load_vars:
        file: "{{ inventory_dir }}/group_vars/proxmox_vms/vault.sops.yaml"
      no_log: true

    - name: Add Tailscale GPG key
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/jammy.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"

    - name: Add Tailscale apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu jammy main"
        filename: tailscale
        state: present

    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        update_cache: true
        state: present

    - name: Enable and start tailscaled
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: Check if already connected to Tailscale
      ansible.builtin.command: tailscale status
      register: tailscale_status
      changed_when: false
      failed_when: false

    - name: Connect to Tailscale
      ansible.builtin.command: tailscale up --authkey {{ vault_tailscale_authkey }}
      when: tailscale_status.rc != 0
      changed_when: tailscale_status.rc != 0
      no_log: true
