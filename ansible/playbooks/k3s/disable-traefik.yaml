---
# Disables Traefik and klipper-lb (servicelb) on an existing k3s cluster.
# Run: ansible-playbook -i inventory/hosts.yaml playbooks/k3s/disable-traefik.yaml
#
# The disable flags must be set on EVERY server. A single server without them
# still runs the servicelb controller, which recreates the svclb DaemonSet for
# every LoadBalancer service. Worse, the servers that *do* have servicelb
# disabled drop net.ipv4.ip_forward from kubelet's unsafe-sysctl allowlist, so
# the svclb pods scheduled there are rejected with SysctlForbidden in a loop.
#
# serial: 1 restarts one control plane node at a time. Restarting all three at
# once would drop the etcd quorum and take the API server down with it.

- name: Disable Traefik and servicelb on k3s servers
  hosts: k3s_control_plane
  become: true
  serial: 1

  tasks:
    - name: Ensure k3s config directory exists
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Write k3s config with Traefik and servicelb disabled
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        content: |
          disable:
            - traefik
            - servicelb
        mode: "0644"
      notify:
        - Restart k3s
        - Wait for k3s API to be ready

  handlers:
    - name: Restart k3s
      ansible.builtin.systemd:
        name: k3s
        state: restarted

    - name: Wait for k3s API to be ready
      ansible.builtin.wait_for:
        port: 6443

- name: Clean up Traefik and klipper-lb resources
  hosts: k3s_init
  become: true

  tasks:
    - name: Delete Traefik HelmChart resource
      ansible.builtin.command:
        cmd: kubectl delete helmchart traefik traefik-crd -n kube-system --ignore-not-found
      changed_when: true

    # Every klipper-lb DaemonSet carries this label, whichever service it was
    # created for — svclb-traefik, svclb-ingress-nginx-controller-<hash>, etc.
    - name: Delete klipper-lb daemonsets
      ansible.builtin.command:
        cmd: >-
          kubectl delete daemonset -n kube-system
          -l svccontroller.k3s.cattle.io/svcname --ignore-not-found
      changed_when: true

    - name: Wait for Traefik pods to terminate
      ansible.builtin.command:
        cmd: kubectl get pods -n kube-system -l app.kubernetes.io/name=traefik --no-headers
      register: traefik_pods
      until: traefik_pods.stdout == ""
      retries: 12
      delay: 5
      changed_when: false
