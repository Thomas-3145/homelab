---
# Removes the Traefik and klipper-lb (servicelb) resources a cluster that once ran
# them has left behind. Replaced by MetalLB + ingress-nginx.
# Run: ansible-playbook -i inventory/hosts.yaml playbooks/k3s/disable-traefik.yaml
#
# This playbook no longer writes /etc/rancher/k3s/config.yaml. It used to render
# a `disable:` block with `copy:`, while the k3s_node role rendered node-label /
# node-taint into the same file with its own `copy:` — two owners of one file, so
# whichever ran last silently erased the other's block.
#
# The disable flags now live in the inventory as `k3s_node_disable` on the
# k3s_control_plane group, and the k3s_node role is the only writer. To change
# which components are disabled, edit the inventory and run:
#
#   ansible-playbook -i inventory/hosts.yaml playbooks/k3s/prepare.yaml \
#     --limit k3s_control_plane --tags k3s-config
#
# That play is serialised one CP node at a time, because restarting all three at
# once drops the etcd quorum and takes the API server down with it.

- name: Clean up Traefik and klipper-lb resources
  hosts: k3s_init
  become: true

  tasks:
    - name: Delete Traefik HelmChart resource
      ansible.builtin.command:
        cmd: kubectl delete helmchart traefik traefik-crd -n kube-system --ignore-not-found
      changed_when: true

    # Every klipper-lb DaemonSet carries this label, whichever service it was
    # created for — svclb-traefik, svclb-ingress-nginx-controller-<hash>, etc.
    - name: Delete klipper-lb daemonsets
      ansible.builtin.command:
        cmd: >-
          kubectl delete daemonset -n kube-system
          -l svccontroller.k3s.cattle.io/svcname --ignore-not-found
      changed_when: true

    - name: Wait for Traefik pods to terminate
      ansible.builtin.command:
        cmd: kubectl get pods -n kube-system -l app.kubernetes.io/name=traefik --no-headers
      register: traefik_pods
      until: traefik_pods.stdout == ""
      retries: 12
      delay: 5
      changed_when: false
