# Ansible inventory for k3s cluster
#
# Groups:
#   proxmox_vms       - All VMs managed by Terraform on Proxmox (gets Tailscale)
#   k3s_init          - First node, bootstraps the cluster (--cluster-init)
#   k3s_servers       - Remaining servers, join via the init node's token
#   k3s_control_plane - Parent group targeting all CP nodes
#   k3s_workers       - Worker nodes (k3s agent)
#   services          - Permanent service VMs (arr-stack, etc.) — only common role
#   test              - Standalone VMs for learning/testing
#   physical_hosts    - Physical machines (Proxmox hosts)

all:
  children:
    proxmox_vms:
      vars:
        ansible_user: ubuntu
        ansible_port: 22456
        ansible_ssh_private_key_file: ~/.ssh/id_rsa_4096
        ansible_python_interpreter: auto
        # Accept new host keys automatically (VMs get new keys after destroy/apply)
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
      children:
        k3s_control_plane:
          children:
            k3s_init:
              hosts:
                k3s-cp-01:
                  ansible_host: 192.168.10.21
            k3s_servers:
              hosts:
                k3s-cp-02:
                  ansible_host: 192.168.10.22
                k3s-cp-03:
                  ansible_host: 192.168.10.23
        services:
          hosts:
            arr-stack:
              ansible_host: 192.168.10.40
              ansible_user: root
              ansible_port: 22
        test:
          hosts: {}
        k3s_workers:
          hosts:
            k3s-worker-01:
              ansible_host: 192.168.10.52
            k3s-worker-02:
              ansible_host: 192.168.10.53
            k3s-worker-03:
              ansible_host: 192.168.10.54
    physical_hosts:
      vars:
        ansible_ssh_private_key_file: ~/.ssh/id_rsa_4096
        ansible_python_interpreter: auto
      hosts:
        pve1:
          ansible_host: pve1.taild78f1d.ts.net
          ansible_user: root
          ansible_port: 22
        pve2:
          ansible_host: pve2.taild78f1d.ts.net
          ansible_user: root
          ansible_port: 22
        pve3:
          ansible_host: pve3.taild78f1d.ts.net
          ansible_user: root
          ansible_port: 22
