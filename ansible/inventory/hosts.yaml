# Ansible inventory for k3s cluster
#
# Groups:
#   proxmox_vms       - All VMs managed by Terraform on Proxmox (gets Tailscale)
#   k3s_init          - First node, bootstraps the cluster (--cluster-init)
#   k3s_servers       - Remaining servers, join via the init node's token
#   k3s_control_plane - Parent group targeting all CP nodes
#   k3s_workers       - Worker nodes (k3s agent)
#   services          - Permanent service VMs (arr-stack, etc.) — only common role
#   test              - Standalone VMs for learning/testing
#   physical_hosts    - Physical machines (Proxmox hosts)

all:
  children:
    proxmox_vms:
      vars:
        ansible_user: ubuntu
        ansible_port: 22456
        ansible_ssh_private_key_file: ~/.ssh/id_rsa_4096
        ansible_python_interpreter: auto
        # Accept new host keys automatically (VMs get new keys after destroy/apply)
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
      children:
        k3s_control_plane:
          children:
            k3s_init:
              hosts:
                k3s-cp-01:
                  ansible_host: 192.168.10.21
            k3s_servers:
              hosts:
                k3s-cp-02:
                  ansible_host: 192.168.10.22
                k3s-cp-03:
                  ansible_host: 192.168.10.23
        services:
          hosts:
            arr-stack:
              ansible_host: 192.168.10.40
              ansible_user: root
              # Hardened to 22456 by the common role. The arr-stack playbook
              # auto-detects port 22 on a freshly provisioned LXC during bootstrap.
              ansible_port: 22456
            ai-lab:
              ansible_host: 192.168.10.41
              ansible_user: root
              # Hardened to 22456 by the common role. The ai-lab playbook
              # auto-detects port 22 on a freshly provisioned LXC during bootstrap.
              ansible_port: 22456
            whisper:
              ansible_host: 192.168.10.42
              ansible_user: root
              # LXC 202 on pve3 — transcription, kept off pve2 so it doesn't
              # compete with the LLM. Same SSH port handling as ai-lab.
              ansible_port: 22456
            pbs:
              ansible_host: 192.168.10.30
              # Debian 13 VM (cloud-init user "ubuntu", inherited from proxmox_vms).
              # The pbs playbook probes port 22 (fresh) / 22456 (hardened) itself.
              ansible_port: 22456
        test:
          hosts: {}
        k3s_workers:
          hosts:
            k3s-worker-01:
              ansible_host: 192.168.10.52
            k3s-worker-02:
              ansible_host: 192.168.10.53
              # pve2 also hosts the RAM-heavy media (LXC 200) + ai-lab (LXC 201)
              # guests, so keep the k3s footprint here minimal. This soft taint
              # makes the scheduler prefer worker-01 (pve1) + worker-03 (pve3) and
              # only spill onto worker-02 when the others are full.
              k3s_node_taints:
                - "workload=offload:PreferNoSchedule"
            k3s-worker-03:
              ansible_host: 192.168.10.54
    physical_hosts:
      vars:
        ansible_ssh_private_key_file: ~/.ssh/id_rsa_4096
        ansible_python_interpreter: auto
      hosts:
        pve1:
          ansible_host: pve1.taild78f1d.ts.net
          ansible_user: root
          ansible_port: 22
        pve2:
          ansible_host: pve2.taild78f1d.ts.net
          ansible_user: root
          ansible_port: 22
          # 65 W desktop CPU in a chassis pve1/pve3 use for 35 W T-processors. It
          # reaches 100 C under sustained load without plateauing, so cap PL1.
          # Only this host — pve1/pve3 run within their thermal envelope.
          proxmox_power_limit_watts: 45
        pve3:
          ansible_host: pve3.taild78f1d.ts.net
          ansible_user: root
          ansible_port: 22
