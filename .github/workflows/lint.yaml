name: Lint & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Public repo — the default token scope is wider than anything here needs.
permissions:
  contents: read

# A quick follow-up push should cancel the previous run, not race it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KUSTOMIZE_VERSION: v5.8.1
  KUBECONFORM_VERSION: v0.8.0

jobs:
  terraform:
    name: Terraform (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [terraform/proxmox, terraform/lia]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -check

      - name: Init
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: kubernetes/ ansible/
          config_file: .yamllint.yaml

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yaml

      - name: Run ansible-lint
        run: cd ansible && ansible-lint -c .ansible-lint .

  kubeconform:
    name: Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin

      - name: Validate manifests
        run: |
          find kubernetes/ -name '*.yaml' \
            ! -name 'kustomization.yaml' \
            ! -name '*.sops.yaml' \
            ! -name 'ksops-generator.yaml' \
            ! -path '*/patches/*' \
            -print0 | xargs -0 kubeconform \
              -strict \
              -ignore-missing-schemas \
              -summary

  kustomize:
    name: Kustomize Render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install kustomize + kubeconform
        run: |
          kustomize_base=https://github.com/kubernetes-sigs/kustomize/releases/download
          curl -fsSL "${kustomize_base}/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin

      # Same script the pre-commit hook runs, so local and CI cannot drift.
      # ksops is absent here, so the script falls back to its stub — see the
      # comment at the top of the script for why that still catches what matters.
      - name: Build and validate every overlay
        run: ./scripts/validate-kustomizations.sh

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  trivy:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy (Terraform)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          exit-code: 1
          severity: HIGH,CRITICAL

      # Kubernetes findings are tracked in the Security tab rather than blocking
      # the build — see the non-root images TODO. SARIF gives them history.
      - name: Run Trivy (Kubernetes)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: kubernetes/
          format: sarif
          output: trivy-kubernetes.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-kubernetes.sarif
          category: trivy-kubernetes
